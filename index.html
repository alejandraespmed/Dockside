<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ask Dockside · Dockside Paddle Co.</title>
<style>
  :root {
    --deep: #0b3a5b;
    --ocean: #0e6ba8;
    --teal: #12a3b4;
    --foam: #e8f6fa;
    --sand: #f6fbfd;
    --ink: #12303f;
    --muted: #5d7886;
    --bubble-bot: #ffffff;
    --bubble-user: linear-gradient(135deg, #0e6ba8, #12a3b4);
    --err-bg: #fff1f0;
    --err-ink: #9a2b22;
    --shadow: 0 6px 20px rgba(11, 58, 91, .10);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --sand: #08202f;
      --foam: #0c2b3e;
      --ink: #e6f3f8;
      --muted: #8fb0bf;
      --bubble-bot: #12384f;
      --err-bg: #3a1a1a;
      --err-ink: #ffb4ab;
      --shadow: 0 6px 20px rgba(0, 0, 0, .35);
    }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    font-size: 17px;
    line-height: 1.5;
    color: var(--ink);
    background: var(--sand);
    display: flex;
    justify-content: center;
  }
  .app {
    width: 100%;
    max-width: 720px;
    height: 100dvh;
    display: flex;
    flex-direction: column;
    background: var(--foam);
    position: relative;
  }
  header {
    position: relative;
    padding: calc(env(safe-area-inset-top, 0px) + 18px) 20px 34px;
    color: #fff;
    background: linear-gradient(160deg, var(--deep) 0%, var(--ocean) 55%, var(--teal) 100%);
    overflow: hidden;
    flex: 0 0 auto;
  }
  header h1 { margin: 0; font-size: 1.45rem; letter-spacing: .2px; display: flex; align-items: center; gap: 10px; }
  header p { margin: 4px 0 0; opacity: .88; font-size: .93rem; }
  .logo {
    width: 38px; height: 38px; border-radius: 12px;
    background: rgba(255,255,255,.18);
    display: grid; place-items: center;
    backdrop-filter: blur(4px);
  }
  .wave { position: absolute; left: 0; right: 0; bottom: -1px; height: 24px; width: 100%; display: block; }
  .wave path { fill: var(--foam); }

  #chat {
    flex: 1 1 auto;
    overflow-y: auto;
    padding: 16px 14px 8px;
    display: flex;
    flex-direction: column;
    gap: 12px;
    scroll-behavior: smooth;
  }
  .msg { display: flex; flex-direction: column; max-width: 86%; }
  .msg.bot { align-self: flex-start; }
  .msg.user { align-self: flex-end; align-items: flex-end; }
  .bubble {
    padding: 11px 15px;
    border-radius: 20px;
    box-shadow: var(--shadow);
    white-space: pre-wrap;
    overflow-wrap: anywhere;
  }
  .bot .bubble { background: var(--bubble-bot); border-bottom-left-radius: 6px; }
  .user .bubble { background: var(--bubble-user); color: #fff; border-bottom-right-radius: 6px; }
  .bubble.error { background: var(--err-bg); color: var(--err-ink); border: 1px solid currentColor; }
  .stamp { font-size: .76rem; color: var(--muted); margin: 4px 8px 0; }

  .thinking .bubble { display: flex; align-items: center; gap: 10px; color: var(--muted); }
  .dots { display: inline-flex; gap: 4px; }
  .dots i {
    width: 7px; height: 7px; border-radius: 50%;
    background: var(--teal); display: block;
    animation: bob 1.1s infinite ease-in-out;
  }
  .dots i:nth-child(2) { animation-delay: .15s; }
  .dots i:nth-child(3) { animation-delay: .3s; }
  @keyframes bob { 0%, 80%, 100% { transform: translateY(0); opacity: .5; } 40% { transform: translateY(-5px); opacity: 1; } }

  .chips { display: flex; flex-wrap: wrap; gap: 8px; padding: 0 14px 8px; }
  .chip {
    font: inherit; font-size: .88rem;
    border: 1px solid rgba(14,107,168,.35);
    background: var(--bubble-bot); color: var(--ocean);
    padding: 6px 12px; border-radius: 999px; cursor: pointer;
  }
  .chip:hover { background: var(--ocean); color: #fff; }
  @media (prefers-color-scheme: dark) { .chip { color: #7fd6e3; } }

  form {
    flex: 0 0 auto;
    display: flex; gap: 10px;
    padding: 10px 14px calc(env(safe-area-inset-bottom, 0px) + 12px);
    background: var(--bubble-bot);
    border-top: 1px solid rgba(14,107,168,.15);
  }
  input[type="text"] {
    flex: 1 1 auto; min-width: 0;
    font: inherit; font-size: 1rem;
    color: var(--ink);
    background: var(--foam);
    border: 1.5px solid transparent;
    border-radius: 999px;
    padding: 12px 18px;
    outline: none;
  }
  input[type="text"]:focus { border-color: var(--teal); }
  button.send {
    flex: 0 0 auto;
    font: inherit; font-weight: 600;
    color: #fff;
    background: linear-gradient(135deg, var(--ocean), var(--teal));
    border: 0; border-radius: 999px;
    padding: 0 22px; cursor: pointer;
  }
  button.send:disabled { opacity: .55; cursor: not-allowed; }
  @media (prefers-reduced-motion: reduce) { .dots i { animation: none; } #chat { scroll-behavior: auto; } }
</style>
</head>
<body>
<div class="app">
  <header>
    <h1>
      <span class="logo" aria-hidden="true">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12c2.5 0 2.5-2 5-2s2.5 2 5 2 2.5-2 5-2 2.5 2 5 2"/><path d="M2 18c2.5 0 2.5-2 5-2s2.5 2 5 2 2.5-2 5-2 2.5 2 5 2"/><path d="M2 6c2.5 0 2.5-2 5-2s2.5 2 5 2 2.5-2 5-2 2.5 2 5 2"/></svg>
      </span>
      Ask Dockside
    </h1>
    <p>Dockside Paddle Co. · Grand Canal Dock</p>
    <svg class="wave" viewBox="0 0 720 24" preserveAspectRatio="none" aria-hidden="true"><path d="M0 12 C 60 0, 120 24, 180 12 S 300 0, 360 12 S 480 24, 540 12 S 660 0, 720 12 L720 24 L0 24 Z"/></svg>
  </header>

  <main id="chat" aria-live="polite"></main>

  <div class="chips" id="chips">
    <button class="chip" type="button">What's available today?</button>
    <button class="chip" type="button">Cheapest session with places left?</button>
    <button class="chip" type="button">Can the sauna run in this wind?</button>
  </div>

  <form id="form" autocomplete="off">
    <input type="text" id="q" placeholder="Ask about tours, prices or wind…" aria-label="Your question" maxlength="500">
    <button class="send" id="send" type="submit">Send</button>
  </form>
</div>

<script>
  const CSV_URL = "https://bdaib-hub.pages.dev/data/dockside/sessions.csv";
  const WEATHER_URL = "https://api.open-meteo.com/v1/forecast?latitude=53.3441&longitude=-6.2386&current=temperature_2m,wind_speed_10m,wind_gusts_10m,precipitation&timezone=Europe%2FDublin";
  const BRAIN_URL = "https://luas-class.kluxy.app/chat";
  const SYSTEM = "You are Ask Dockside, the customer assistant for Dockside Paddle Co. a watersports company at Grand Canal Dock, five minutes from NCI: paddle boards, kayaks, a dragon boat, a wakeboard cable and a floating sauna. Answer only from the live data you are given. Quote exact prices in euro, and slots available. If something is not in the data, say so. If a value looks implausible, say so and suggest the customer checks with staff. Be warm and brief.";

  const chat = document.getElementById("chat");
  const form = document.getElementById("form");
  const input = document.getElementById("q");
  const sendBtn = document.getElementById("send");
  const chips = document.getElementById("chips");
  let busy = false;

  function scrollDown() { chat.scrollTop = chat.scrollHeight; }

  function addMessage(role, text, opts = {}) {
    const wrap = document.createElement("div");
    wrap.className = "msg " + role + (opts.thinking ? " thinking" : "");
    const bubble = document.createElement("div");
    bubble.className = "bubble" + (opts.error ? " error" : "");
    if (opts.thinking) {
      bubble.innerHTML = '<span class="dots"><i></i><i></i><i></i></span><span>Thinking...</span>';
    } else {
      bubble.textContent = text;
    }
    wrap.appendChild(bubble);
    if (opts.stamp) {
      const s = document.createElement("div");
      s.className = "stamp";
      s.textContent = opts.stamp;
      wrap.appendChild(s);
    }
    chat.appendChild(wrap);
    scrollDown();
    return wrap;
  }

  function hhmmss(d) {
    return d.toLocaleTimeString("en-IE", { hour12: false, hour: "2-digit", minute: "2-digit", second: "2-digit" });
  }

  async function getText(url, label) {
    const res = await fetch(url, { cache: "no-store" });
    if (!res.ok) throw new Error(label + " request failed (HTTP " + res.status + ").");
    return res.text();
  }

  async function fetchLiveData() {
    const [csv, weatherText] = await Promise.all([
      getText(CSV_URL, "Tour catalogue"),
      getText(WEATHER_URL, "Weather")
    ]);
    let weather;
    try { weather = JSON.parse(weatherText); }
    catch (e) { throw new Error("Weather data was not valid JSON."); }
    const cur = weather && weather.current;
    if (!cur) throw new Error("Weather data had no current conditions.");

    const fetchedAt = new Date();
    const dublinNow = fetchedAt.toLocaleTimeString("en-IE", { hour12: false, hour: "2-digit", minute: "2-digit", timeZone: "Europe/Dublin" });
    const units = weather.current_units || {};
    const weatherBlock =
      "\n\nCurrent weather at Grand Canal Dock (live, Open-Meteo):\n" +
      "wind_speed_10m = " + cur.wind_speed_10m + " " + (units.wind_speed_10m || "km/h") + "\n" +
      "wind_gusts_10m = " + cur.wind_gusts_10m + " " + (units.wind_gusts_10m || "km/h") + "\n" +
      "temperature_2m = " + cur.temperature_2m + " " + (units.temperature_2m || "°C") + "\n" +
      "precipitation = " + cur.precipitation + " " + (units.precipitation || "mm") + "\n" +
      "Current local time in Dublin: " + dublinNow + "\n" +
      "Rule: a session runs only if the current wind_speed_10m is at or below that session's max_wind_kmh.";
    return { text: csv + weatherBlock, fetchedAt };
  }

  async function ask(question) {
    const { text, fetchedAt } = await fetchLiveData();
    const res = await fetch(BRAIN_URL, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        system: SYSTEM,
        messages: [{ role: "user", content: "Live data (CSV):\n" + text + "\n\nCustomer question: " + question }]
      })
    });
    if (!res.ok) throw new Error("The assistant request failed (HTTP " + res.status + ").");
    let data;
    try { data = await res.json(); }
    catch (e) { throw new Error("The assistant returned an unreadable response."); }
    if (!data || typeof data.reply !== "string") {
      throw new Error(data && data.error ? String(data.error) : "The assistant response had no \"reply\" field.");
    }
    return { reply: data.reply, fetchedAt };
  }

  async function handleSend(question) {
    question = question.trim();
    if (!question || busy) return;
    busy = true;
    sendBtn.disabled = true;
    chips.style.display = "none";
    addMessage("user", question);
    input.value = "";
    const thinking = addMessage("bot", "", { thinking: true });
    try {
      const { reply, fetchedAt } = await ask(question);
      thinking.remove();
      addMessage("bot", reply, { stamp: "Data fetched live at " + hhmmss(fetchedAt) });
    } catch (err) {
      thinking.remove();
      addMessage("bot", "Sorry, something went wrong: " + (err && err.message ? err.message : err), { error: true });
    } finally {
      busy = false;
      sendBtn.disabled = false;
      input.focus();
    }
  }

  form.addEventListener("submit", (e) => { e.preventDefault(); handleSend(input.value); });
  chips.addEventListener("click", (e) => {
    if (e.target.classList.contains("chip")) handleSend(e.target.textContent);
  });

  addMessage("bot", "Hi, I'm Ask Dockside 🌊 Ask me about today's paddle boards, kayaks, the dragon boat, the wakeboard cable or the floating sauna: prices, free places and whether the wind allows them to run.");
</script>
</body>
</html>
